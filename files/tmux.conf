# tmux.conf — workbench-shell
# Included from a workbench block at the top of your own tmux config
# (workbench-core docs/decisions-log.md D82). Settings in your file win.
# Don't edit this file — it's replaced on every update. Stop using it:
# wb files policy shell tmux.conf skip
#
# This file holds plain settings and the default values of the plugin options
# only. It declares no plugins and starts nothing. The plugins and TPM are in
# tmux-plugins.conf, next to this file, which you opt into by adding one line
# as the LAST line of your own tmux config (see the README). TPM has to run
# last: it reads the plugin list and these options when it starts.
#
# Default shell is intentionally not set here — tmux inherits the login shell.

# ── Terminal ──────────────────────────────────────────────────────────────────
set -g default-terminal "screen-256color"
set -ga terminal-overrides ",*256col*:Tc"   # true-colour passthrough

# ── General ───────────────────────────────────────────────────────────────────
set -g mouse on
set -g history-limit 10000
set -g base-index 1           # windows start at 1, not 0
setw -g pane-base-index 1     # panes start at 1, not 0
set -g renumber-windows on    # close a window → remaining windows renumber

# ── Plugin options ────────────────────────────────────────────────────────────
# Used only if you source tmux-plugins.conf; inert otherwise.
#
# Session persistence (resurrect + continuum)
set -g @continuum-restore 'on'
# Off: tmux-continuum would otherwise be asked to start tmux at boot. Set 'on'
# in your own file, below the block, if you want that.
set -g @continuum-boot 'off'
set -g @resurrect-capture-pane-contents 'on'

# ── Dracula theme ─────────────────────────────────────────────────────────────
# Full plugin reference: https://draculatheme.com/tmux
set -g @dracula-show-left-icon shortname
set -g @dracula-show-powerline true
set -g @dracula-refresh-rate 5
set -g @dracula-show-flags true
set -g @dracula-plugins "cpu-usage ram-usage ssh-session weather time"
set -g @dracula-day-month true
set -g @dracula-military-time true
set -g @dracula-show-fahrenheit false
set -g @dracula-show-location true

# ── Sidebar ───────────────────────────────────────────────────────────────────
set -g @sidebar-tree-position 'right'
set -g @sidebar-tree-command 'tree -C'
