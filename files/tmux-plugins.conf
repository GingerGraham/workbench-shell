# tmux-plugins.conf — workbench-shell
# The plugins workbench-shell recommends, and TPM to load them. Optional: it
# does nothing unless you source it. Add this as the LAST line of your own
# tmux config, after any plugins of your own:
#
#   source-file -q ~/.local/share/workbench/modules/shell/current/files/tmux-plugins.conf
#
# (If XDG_DATA_HOME is set, the path starts there instead of ~/.local/share.)
#
# It has to be last because TPM reads the plugin list, and the plugin options
# set earlier in your config, when it runs. Add your own
# `set -g @plugin '...'` lines and your own plugin options ABOVE that line.
#
# Don't edit this file — it's replaced on every update. Plugin options are in
# tmux.conf (the block at the top of your config); override them in your own
# file, above the source-file line.
#
# On the first start without ~/.tmux/plugins/tpm, TPM is cloned from GitHub and
# the plugins below are installed from their default branches, unverified.

# ── Plugins ───────────────────────────────────────────────────────────────────
set -g @plugin 'tmux-plugins/tpm'
set -g @plugin 'tmux-plugins/tmux-sensible'
set -g @plugin 'ofirgall/tmux-window-name'
set -g @plugin 'dracula/tmux'
set -g @plugin 'tmux-plugins/tmux-resurrect'
set -g @plugin 'tmux-plugins/tmux-continuum'
set -g @plugin 'tmux-plugins/tmux-sidebar'
set -g @plugin 'nhdaly/tmux-better-mouse-mode'

# ── TPM bootstrap + init (must be last) ───────────────────────────────────────
# Clones TPM and installs all plugins automatically on a fresh machine.
if "test ! -d ~/.tmux/plugins/tpm" \
   "run 'git clone https://github.com/tmux-plugins/tpm ~/.tmux/plugins/tpm \
   && ~/.tmux/plugins/tpm/bin/install_plugins'"

run -b '~/.tmux/plugins/tpm/tpm'
