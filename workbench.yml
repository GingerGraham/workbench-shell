# workbench.yml — workbench-shell
#
# Ecosystem module (workbench-core ARCHITECTURE.md §2/§3): opinionated
# shell/editor/prompt layer. Requires workbench-core only — works without
# any other workbench module. Uses workbench-core's loader and Core API
# (elevation/_read_prompt/_str_lower, platform facts, installers-common.sh).
#
# See contracts/manifest-spec.md (in workbench-core) for the full field
# reference.
version: 2
branch: main

core_api: ">=1.8 <2.0"
sync:
  enabled: true

overrides_src: shell/overrides.sh

info:
  description: "Shell/editor/prompt layer — aliases, direnv, fzf, and omp/starship/omz prompt engines"

deploy:
  # Whole files (D81 lifecycle): neither tool can include another config
  # file. Refreshed while unedited, never touched once edited.
  - src: files/starship.toml
    dest: ~/.config/starship.toml
    mode: copy
  - src: files/direnv.toml
    dest: ~/.config/direnv/direnv.toml
    mode: copy

layers:
  # D82: workbench-core adds a block at the top of your own tmux and vim
  # config that includes these. Anything you set in your file wins.
  - tool: tmux.conf
    src: files/tmux.conf
  - tool: vimrc
    src: files/vimrc

register:
  shell:
    - src: shell/editors.sh
      tier: env
    - src: shell/aliases.sh
      tier: core
    - src: shell/bash.sh
      tier: core
    - src: shell/zsh.sh
      tier: core
    - src: shell/omp.sh
      tier: tools
    - src: shell/starship.sh
      tier: tools
    - src: shell/omz.sh
      tier: tools
    - src: shell/zsh-plugins.sh
      tier: tools
    - src: shell/direnv.sh
      tier: tools
    - src: shell/fzf.sh
      tier: tools
  installers:
    - src: shell/installers.sh
  getters:
    - name: shell
      function: get-shell-functions
      label: "Shell/prompt/editor helpers (aliases, direnv, fzf, prompt engines)"
